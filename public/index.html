<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipload - رفع الملفات وإدارة IP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Ipload</h1>
            <p>نظام رفع الملفات وإدارة عناوين IP</p>
        </header>

        <div class="ip-section">
            <h2>عنوان IP الخاص بك</h2>
            <div id="ip-display" class="ip-box">جاري التحميل...</div>
            <button onclick="refreshIP()" class="btn btn-secondary">تحديث IP</button>
        </div>

        <div class="upload-section">
            <h2>رفع ملف</h2>
            <form id="upload-form">
                <div class="file-input-wrapper">
                    <input type="file" id="file-input" name="file" required>
                    <label for="file-input" class="file-label">اختر ملفاً</label>
                    <span id="file-name">لم يتم اختيار ملف</span>
                </div>
                <button type="submit" class="btn btn-primary">رفع الملف</button>
            </form>
            <div id="upload-status"></div>
        </div>

        <div class="files-section">
            <h2>الملفات المرفوعة</h2>
            <button onclick="loadFiles()" class="btn btn-secondary">تحديث القائمة</button>
            <div id="files-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
